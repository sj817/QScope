[package]
name = "qscope-qqnt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
qscope-automation.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
sevenz-rust2 = { version = "=0.24.2", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[lints.rust]
unsafe_code = "deny"

[build-dependencies]
cc = "=1.11.0"
