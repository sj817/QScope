[package]
name = "qscope-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "compression", "common-controls-v6"] }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-dialog = { version = "=2.8.4", default-features = false }
qscope-automation.workspace = true
clap.workspace = true
serde_json.workspace = true
tempfile.workspace = true
sha2.workspace = true

[target.'cfg(any(windows, target_os = "macos"))'.build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[lints]
workspace = true
