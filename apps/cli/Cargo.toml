[package]
name = "qscope-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "qscope-cli"
path = "src/main.rs"

[[test]]
name = "cli"
path = "../../tests/cli/cli.rs"

[dependencies]
open = "=5.4.5"
base64.workspace = true
clap.workspace = true
qscope-core.workspace = true
qscope-automation = { workspace = true, features = ["update"] }
qscope-web = { path = "../web/server" }
qscope-qqnt = { path = "../../collectors/qqnt-windows/host-rs" }
qscope-qqnt-macos = { path = "../../collectors/qqnt-macos" }
serde_json.workspace = true
tempfile.workspace = true
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "signal"] }

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "=0.56.0"

