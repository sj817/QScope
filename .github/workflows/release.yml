name: release

# 平台构建仅产出分发包，聚合任务独占在线更新签名密钥。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/package.yml

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 准备签名环境
        uses: ./.github/actions/setup
        with:
          rust: "false"
      - name: 校验发布版本
        id: metadata
        run: pnpm release version
      - name: 下载两端分发包
        uses: actions/download-artifact@v7
        with:
          pattern: qscope-release-*
          path: build/release-input
      - name: 校验并聚合平台资产
        run: pnpm release assemble --input build/release-input --out build/release-assets
      - name: 签名在线更新清单
        env:
          QSCOPE_RELEASE_SIGNING_KEY: ${{ secrets.QSCOPE_RELEASE_SIGNING_KEY }}
        run: pnpm release:sign sign --dir build/release-assets --version ${{ steps.metadata.outputs.version }} --platform all
      - name: 生成完整校验清单
        run: pnpm release checksums --dir build/release-assets
      - name: 保存手动构建结果
        uses: actions/upload-artifact@v7
        if: github.ref_type != 'tag'
        with:
          name: qscope-release
          path: build/release-assets
          if-no-files-found: error
          retention-days: 7
      - name: 发布 GitHub 版本
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          name: QScope ${{ steps.metadata.outputs.version }}
          files: build/release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
