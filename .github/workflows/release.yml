name: Release

# Platform builds never receive the release private key. One final job signs
# both manifests and publishes all assets together; manual runs retain an artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Install pinned pnpm
        run: npm install --global pnpm@9.15.9
      - name: Check the tag against the workspace version
        run: node tools/release-workflow.ts version
      - name: Verify Apple Silicon runner
        if: runner.os == 'macOS'
        run: node --input-type=module -e "import assert from 'node:assert/strict'; assert.equal(process.platform, 'darwin'); assert.equal(process.arch, 'arm64');"
      - name: Build and test synthetic Mac native capture
        if: runner.os == 'macOS'
        run: |
          node tools/build-native-macos.ts
          node tools/test-native-macos.ts
      - name: Build desktop, CLI and installer
        env:
          GH_TOKEN: ${{ github.token }}
          # Without Apple credentials this verifies ad-hoc signatures, not notarization.
          APPLE_SIGNING_IDENTITY: "-"
        run: node tools/build-desktop.ts
      - name: Verify extracted Mac app, DMG and standalone CLI with synthetic captures
        if: runner.os == 'macOS'
        run: node apps/cli/tests/packaged-macos.ts
      - name: Verify real signed Mac update archives and rollback backup
        if: runner.os == 'macOS'
        run: node tools/test-update-macos.ts
      - name: Collect verified platform assets
        run: node tools/release-workflow.ts collect --platform ${{ matrix.platform }} --out build/release-assets
      - uses: actions/upload-artifact@v7
        with:
          name: qscope-release-${{ matrix.platform }}
          path: build/release-assets
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Check release version
        id: metadata
        run: node tools/release-workflow.ts version
      - uses: actions/download-artifact@v7
        with:
          pattern: qscope-release-*
          path: build/release-input
      - name: Verify and combine both platform artifacts
        run: node tools/release-workflow.ts assemble --input build/release-input --out build/release-assets
      - name: Sign platform update manifests
        env:
          QSCOPE_RELEASE_SIGNING_KEY: ${{ secrets.QSCOPE_RELEASE_SIGNING_KEY }}
        run: node tools/release-sign.ts sign --dir build/release-assets --version ${{ steps.metadata.outputs.version }} --platform all
      - name: Hash every published package and signed manifest
        run: node tools/release-workflow.ts checksums --dir build/release-assets
      - name: Keep the complete signed build of a manual run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: qscope-release
          path: build/release-assets
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Publish all assets in one GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release-workflow.ts publish --dir build/release-assets
