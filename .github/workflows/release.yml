name: Release

# A version tag (v0.1.0) builds, signs and publishes the release. A manual run builds and
# uploads the same files as a workflow artifact without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Install pinned pnpm
        run: npm install --global pnpm@9.15.9
      - name: Check the tag against the workspace version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(node -p "require('./apps/web/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi
      - name: Build desktop, CLI and installer
        env:
          GH_TOKEN: ${{ github.token }}
          QSCOPE_RELEASE_SIGNING_KEY: ${{ secrets.QSCOPE_RELEASE_SIGNING_KEY }}
        run: node tools/build-desktop.ts
      - name: Collect release files
        id: files
        shell: bash
        run: |
          directory=$(ls -d dist/QScope-*-release)
          test "$(echo "$directory" | wc -l)" = 1
          # Online updates trust only a signed manifest.
          test -f "$directory/qscope-update.json.sig"
          ls -l "$directory"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
      - name: Keep the build of a manual run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: qscope-release
          path: ${{ steps.files.outputs.directory }}
          retention-days: 7
      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DIRECTORY: ${{ steps.files.outputs.directory }}
        run: >-
          gh release create "$GITHUB_REF_NAME" "$DIRECTORY"/*
          --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "QScope ${GITHUB_REF_NAME#v}" --generate-notes
