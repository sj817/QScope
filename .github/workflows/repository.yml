name: repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: checks and synthetic tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 准备开发环境
        uses: ./.github/actions/setup
      - name: 检查代码与契约
        run: pnpm check
      - name: 运行脚本与 Rust 测试
        run: pnpm test
      - name: 安装测试浏览器
        if: runner.os != 'Windows'
        run: pnpm --filter @qscope/tests exec playwright install --with-deps ${{ runner.os == 'macOS' && 'webkit' || 'chromium' }}
      - name: 验证 WebUI
        run: pnpm test:webui
      - name: 验证本机采集器
        if: runner.os != 'Linux'
        run: pnpm build:native && pnpm test:native
      - name: 验证 Linux 命令行分发包
        if: runner.os == 'Linux'
        run: pnpm build:cli && pnpm test:packaged
      - name: 保存失败时的浏览器跟踪
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-${{ matrix.os }}
          path: tests/test-results
          if-no-files-found: ignore
          retention-days: 7

  package:
    if: github.event_name != 'pull_request'
    needs: check
    uses: ./.github/workflows/package.yml
