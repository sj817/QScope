[workspace]
members = ["crates/qscope-core", "crates/qscope-automation", "apps/cli", "apps/web/server", "apps/desktop", "collectors/qqnt-windows/host-rs", "collectors/qqnt-macos"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
base64 = "=0.22.1"
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
getrandom = "=0.4.3"
qscope-core = { path = "crates/qscope-core" }
qscope-automation = { path = "crates/qscope-automation" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = "debuginfo"

