[package]
name = "qscope-automation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# CLI 与后台共用在线更新的 HTTPS 下载及发布签名校验。
update = ["dep:base64", "dep:ring", "dep:semver", "reqwest/rustls"]

[dependencies]
base64 = { workspace = true, optional = true }
ring = { version = "=0.17.14", optional = true }
semver = { version = "=1.0.28", optional = true }
zip = { version = "=9.4.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
getrandom.workspace = true
qscope-core.workspace = true
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
ts-rs = "=12.0.1"

[lints]
workspace = true
